[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ideswap"
version = "0.1.0"
description = "Move Android/Java/Kotlin projects between Android Studio and VS Code without losing settings."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ideswap = "ideswap.cli:main"

[tool.setuptools]
packages = ["ideswap"]
